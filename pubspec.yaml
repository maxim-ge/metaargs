name: metaargs
description: >-
  Declarative command-line argument parsing for Dart: build an immutable
  command/option tree with a closure DSL, then parse, dispatch, and render
  help. A self-educational project, not intended for production use.
version: 1.0.0-dev
repository: https://github.com/maxim-ge/metaargs

environment:
  sdk: ^3.11.4

dev_dependencies:
  args: ^2.7.0
  lints: ^6.0.0
  test: ^1.25.6
